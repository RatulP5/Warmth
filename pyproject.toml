[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatwave-ml"
version = "0.1.0"
description = "Tools for exploring Kolkata geospatial data and developing heatwave prediction models."
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.14",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

'target-version' = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
