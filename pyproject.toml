[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heatwave-ai"
version = "0.1.0"
description = "Extreme Heatwave Early Warning and Human Thermal Stress Index System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Heatwave AI Core Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "pyarrow>=14.0.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "torch>=2.0.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
